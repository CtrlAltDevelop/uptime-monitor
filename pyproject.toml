[project]
name = "uptime-monitor"
version = "1.0.0"
description = "Self-hosted uptime monitor: Django, Django Ninja and a glass-style Unfold admin."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "django>=5.1,<6",
    "django-ninja>=1.4",
    "django-unfold>=0.60",
    "certifi",
    "gunicorn>=23",
    "whitenoise>=6.7",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false  # a Django project, not an installable package
