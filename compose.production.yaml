# Production-like stack: PostgreSQL + web + worker + Caddy (automatic HTTPS).
# Use together with compose.yaml:
#   docker compose -f compose.yaml -f compose.production.yaml up -d
# (`make prod-up` does this and creates .env from .env.production.example first.)

x-prod-env: &prod-env
  HTTPS: "1"
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB:-uptime}
  POSTGRES_USER: ${POSTGRES_USER:-uptime}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uptime}
      POSTGRES_USER: ${POSTGRES_USER:-uptime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    environment: *prod-env
    ports: !reset []   # only Caddy is published
    depends_on:
      db:
        condition: service_healthy

  worker:
    environment: *prod-env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-status.localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
