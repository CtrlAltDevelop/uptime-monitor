name: Deploy GitHub Pages

# Publishes only on main, i.e. after a PR into main is merged (nothing deploys from develop or from open PRs).
# Must be a push event: the github-pages environment only accepts deployments from the main branch, and
# pull_request_target runs get deployed under the PR's head ref (develop), which the environment rejects.
on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
