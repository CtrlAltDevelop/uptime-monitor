name: CI

# Runs only for pull requests into main.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/python-test.yml@v1.2.0
    permissions:
      contents: read
    with:
      install: uv sync
      test-command: make check && make test
